<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>KDT Lighting Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202610120008">
</head>
<body data-view="front">
<main>
  <section class="view-col" id="views">
    <div class="menu-wrap">
      <button id="more" class="btn icon" aria-label="Menu" title="Menu">
        <svg viewBox="0 0 16 16"><path d="M2 3.5h12v1.6H2zM2 7.2h12v1.6H2zM2 10.9h12v1.6H2z"/></svg>
      </button>
      <div id="menu" class="menu" hidden>
        <div id="track-name" class="menu-note">No track loaded</div>
        <label>Load track<input id="track-file" type="file" accept="audio/*" hidden></label>
        <button id="watch">Watch</button>
        <button id="people">Hide people</button>
        <button id="theme">Dark mode</button>
        <button id="export-pdf">Export PDF</button>
        <button id="export">Export show</button>
        <label>Import show<input id="import" type="file" accept=".json,application/json" hidden></label>
        <button id="reset">Clear lights</button>
      </div>
    </div>
    <div class="seg view-switch">
      <button class="btn small" data-view-pick="front">Front</button>
      <button class="btn small" data-view-pick="three">3D</button>
    </div>
    <div class="panel view" data-view="front">
      <div class="panel-head"><h2>Front view</h2></div>
      <div class="fit"><canvas id="front"></canvas></div>
    </div>
    <div class="grip split" data-grip="split" title="Drag to resize"></div>
    <div class="panel view" data-view="three">
      <div class="panel-head"><h2>3D view</h2><span class="hint">Drag to orbit, Cmd + scroll or pinch to zoom</span></div>
      <div id="three"><div id="three-fallback">The 3D view needs an internet connection to load Three.js.</div></div>
    </div>
  </section>

  <div class="grip" data-grip="view" title="Drag to resize"></div>

  <section class="panel plan-col">
    <div class="plan-wrap">
      <svg id="plan" class="plan" viewBox="250 110 1500 1010" xmlns="http://www.w3.org/2000/svg"></svg>
      <button id="deselect" class="btn small chip" hidden>Deselect</button>
      <button id="plan-reset" class="btn small chip" hidden>Reset zoom</button>
    </div>
  </section>

  <div class="grip" data-grip="plan" title="Drag to resize"></div>

  <aside class="panel side" id="mods">
    <div class="group" id="sec-cue" hidden>
      <div class="sec-head"><h3>Cue</h3></div>
      <div id="cue-edit" class="cue-edit"></div>
    </div>

    <div class="group">
      <div class="sec-head"><h3>LEDs</h3><span id="led-count" class="count"></span></div>
      <div class="line">
        <span class="lbl">Select</span>
        <div class="seg">
          <button class="btn" data-pick="led:all">All</button>
          <button class="btn" data-pick="led:0">Back</button>
          <button class="btn" data-pick="led:1">Mid</button>
          <button class="btn" data-pick="led:2">Front</button>
        </div>
      </div>
      <div id="sel-leds" hidden>
        <div class="line top">
          <span class="lbl">Color</span>
          <div class="swatches" id="led-colors"></div>
        </div>
        <div class="line">
          <span class="lbl">Aim</span>
          <div class="seg">
            <button class="btn" id="aim-down">Straight down</button>
            <button class="btn" id="aim-zone">Aim at zone</button>
          </div>
        </div>
      </div>
      <div class="line">
        <span class="lbl">Effect</span>
        <select id="effect"></select>
        <span class="lbl short">BPM</span>
        <input id="bpm" type="number" min="20" max="300" step="1">
      </div>
    </div>

    <div class="group">
      <div class="sec-head"><h3>Spotlights</h3><span id="spot-count" class="count"></span></div>
      <div class="line">
        <span class="lbl">Select</span>
        <div class="seg">
          <button class="btn" data-pick="spot:all">All</button>
          <button class="btn" data-pick="spot:0">Back</button>
          <button class="btn" data-pick="spot:1">Mid</button>
          <button class="btn" data-pick="spot:2">Front</button>
        </div>
      </div>
      <div id="sel-spots" hidden>
        <div class="line">
          <span class="lbl">Switch</span>
          <div class="seg">
            <button class="btn" data-sel-spots="on">On</button>
            <button class="btn" data-sel-spots="off">Off</button>
          </div>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="sec-head"><h3>Side lights</h3><span id="side-count" class="count"></span></div>
      <div class="line">
        <span class="lbl">Select</span>
        <div class="seg"><button class="btn" data-pick="side:all">All positions</button></div>
      </div>
      <div id="sel-sides" hidden>
        <div class="line">
          <span class="lbl">Switch</span>
          <div class="seg">
            <button class="btn" data-sel-sides="on">On</button>
            <button class="btn" data-sel-sides="off">Off</button>
          </div>
        </div>
      </div>
      <div class="line">
        <span class="lbl">Height</span>
        <div class="seg" id="side-types"></div>
      </div>
    </div>

    <div class="group">
      <div class="sec-head"><h3>Face lights</h3></div>
      <div class="line">
        <span class="lbl">Level</span>
        <div class="seg" id="face"></div>
      </div>
    </div>

    <div class="group">
      <div class="sec-head"><h3>Cyclorama</h3></div>
      <div class="line top">
        <span class="lbl">Color</span>
        <div class="swatches" id="cyclo-colors"></div>
      </div>
    </div>
  </aside>
</main>

<footer class="dock">
  <div class="transport">
    <button id="play" class="btn icon" title="Play or pause (space)"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg></button>
    <button id="prev-cue" class="btn icon" title="Previous cue"><svg viewBox="0 0 16 16"><path d="M3 3h1.8v10H3zM13 3v10L5.5 8z"/></svg></button>
    <button id="next-cue" class="btn icon" title="Next cue"><svg viewBox="0 0 16 16"><path d="M11.2 3H13v10h-1.8zM3 3v10l7.5-5z"/></svg></button>
    <button id="add-cue" class="btn icon primary" title="Add a cue here"><svg viewBox="0 0 16 16"><path d="M7.1 2.5h1.8v4.6h4.6v1.8H8.9v4.6H7.1V8.9H2.5V7.1h4.6z"/></svg></button>
    <span id="time" class="time">0:00.0 / 1:00.0</span>
    <span id="next-text" class="hint"></span>
  </div>
  <canvas id="wave"></canvas>
</footer>

<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js?v=202610120008"></script>
</body>
</html>
